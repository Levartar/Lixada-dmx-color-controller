<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMX Light Controller</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
      // Firebase config (use the same values you already have)
      var firebaseConfig = {
        apiKey: "AIzaSyCCj0TsS2oPuuNC69aPfgSH8fL1LEunVRg",
        authDomain: "dmx-color.firebaseapp.com",
        projectId: "dmx-color",
        storageBucket: "dmx-color.firebasestorage.app",
        messagingSenderId: "290688576796",
        appId: "1:290688576796:web:4a04e1767916f35923ded9",
        databaseURL: "https://dmx-color-default-rtdb.europe-west1.firebasedatabase.app" // add your DB URL if known
      };
      // Initialize v8 namespaced SDK so window.firebase and firebase.database() work
      firebase.initializeApp(firebaseConfig);
    </script>
</head>
<body>
    <h1>DMX Light Controller</h1>
    <div id="controller">
        <form id="form">
            <!-- Intensity slider over the color picker -->
            <label>Intensity</label>
            <input type="range" id="intensity" min="0" max="255" value="128"><br>

            <!-- Color Wheel for selecting RGB color -->
            <div id="color-wheel">
                <label>Pick a Color</label>
                <input type="color" id="color-picker" value="#ffffff">
            </div>

            <!-- RGB Sliders -->
            <label>Red</label>
            <input type="range" id="red" min="0" max="255" value="0"><br>

            <label>Green</label>
            <input type="range" id="green" min="0" max="255" value="0"><br>

            <label>Blue</label>
            <input type="range" id="blue" min="0" max="255" value="0"><br>

            <!-- Additional Sliders for Effects -->
            <label>White</label>
            <input type="range" id="white" min="0" max="255" value="0"><br>

            <label>Amber</label>
            <input type="range" id="amber" min="0" max="255" value="0"><br>

            <label>Violet</label>
            <input type="range" id="violet" min="0" max="255" value="0"><br>

            <label>Strobe</label>
            <input type="range" id="strobe" min="0" max="255" value="0"><br>

            <label>Color Shift</label>
            <input type="range" id="color_shift" min="0" max="255" value="0"><br>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
