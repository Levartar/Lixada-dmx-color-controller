<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMX Light Controller</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sliders.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
      // Firebase config (use the same values you already have)
      var firebaseConfig = {
        apiKey: "AIzaSyCCj0TsS2oPuuNC69aPfgSH8fL1LEunVRg",
        authDomain: "dmx-color.firebaseapp.com",
        projectId: "dmx-color",
        storageBucket: "dmx-color.firebasestorage.app",
        messagingSenderId: "290688576796",
        appId: "1:290688576796:web:4a04e1767916f35923ded9",
        databaseURL: "https://dmx-color-default-rtdb.europe-west1.firebasedatabase.app" // add your DB URL if known
      };
      // Initialize v8 namespaced SDK so window.firebase and firebase.database() work
      firebase.initializeApp(firebaseConfig);
    </script>
</head>
<body>
    <!-- small login overlay -->
    <div id="login-overlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:999;">
      <div style="background:#fff;padding:18px;border-radius:8px;width:320px;max-width:90%;">
        <h3 style="margin:0 0 8px;color:black;">Sign in</h3>
        <input id="login-email" type="email" placeholder="email" style="width:95%;margin-bottom:8px;padding:8px">
        <input id="login-pass" type="password" placeholder="password" style="width:95%;margin-bottom:8px;padding:8px">
        <div style="display:flex;gap:8px">
          <button id="login-btn" style="flex:1;padding:8px">Sign in</button>
          <button id="login-guest" style="flex:1;padding:8px">Cancel</button>
        </div>
        <div id="login-error" style="color:#c00;margin-top:8px;display:none;"></div>
      </div>
    </div>

    <div class="header">
        <h1>DMX Light Controller</h1>
        <button id="open-login-btn" style="z-index:1000;padding:8px 8px;">Login</button>
    </div>

    <form id="form" class="grid">
        <div class="module glass">
            <label class="slider-label">Intensity</label>
            <input class="slider" type="range" id="intensity" min="0" max="255" value="128"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">Red</label>
            <input class="slider" type="range" id="red" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">Green</label>
            <input class="slider" type="range" id="green" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">Blue</label>
            <input class="slider" type="range" id="blue" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">White</label>
            <input class="slider" type="range" id="white" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">Amber</label>
            <input class="slider" type="range" id="amber" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">Violet</label>
            <input class="slider" type="range" id="violet" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">Strobe</label>
            <input class="slider" type="range" id="strobe" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass">
            <label class="slider-label">Color Shift</label>
            <input class="slider" type="range" id="color_shift" min="0" max="255" value="0"><br>
        </div>
        <div class="module glass" id="color-wheel">
            <label class="slider-label">Pick a Color</label>
            <input type="color" id="color-picker" value="#ffffff">
        </div>
    </form>
    <script type="module" src="script.js"></script>
</body>
</html>
